spring.application.name=wealthos

spring.datasource.url=jdbc:postgresql://localhost:5432/wealthos
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.default-schema=wealthos
spring.flyway.schemas=wealthos
spring.jpa.properties.hibernate.default_schema=wealthos
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info